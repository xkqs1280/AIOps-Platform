#
 version 7.1.070, Release 6339P01
#
 sysname HX-SW2
#
 clock timezone Beijing add 08:00:00
#
 header login %Unauthorized access is prohibited.%
 header shell %Unauthorized access is prohibited.%
#
 ssh server enable
#
 ntp-service unicast-server 192.168.124.1
#
 info-center enable
 info-center loghost 192.168.124.10
#
 snmp-agent community read cipher $c$3$Qk9rWGZtN3lQaGFz
 snmp-agent sys-info version v3
#
 archive configuration location flash:/archive
 archive configuration interval 1440
#
 stp global enable
 bpdu-protection
#
 port-security enable
#
 ip https server
 ip https ssl-server-policy ssl-policy1
#
 local-user admin class manage
  password cipher $c$3$N3F4aDlUeG1McDJa
  service-type ssh https
  authorization-attribute user-role network-admin
#
interface Vlan-interface100
 ip address 192.168.124.12 255.255.255.0
#
interface GigabitEthernet1/0/1
 port link-type trunk
 port trunk permit vlan 100
 bpdu-protection
 port-security max-mac-count 5
#
user-interface vty 0 4
 authentication-mode scheme
 protocol inbound ssh
 user privilege level 15
 idle-timeout 10 0
#
