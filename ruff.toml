# 静态检查配置。
#
# 目标：只拦住「真会出问题」的类别（语法错误、未定义名、重复定义、可疑格式串），
# 不做风格强制——存量代码量大，风格规则会让 CI 常年红灯，反而失去意义。
# F401（未使用导入）/ F841（未使用变量）历史上存量较多，先不纳入门禁。
line-length = 120
target-version = "py310"

[lint]
select = ["E9", "F"]
ignore = ["F401", "F841"]

[lint.per-file-ignores]
# 测试里用 assert 做断言，且常在断言失败后才用到的变量会被判未使用
"tests/*" = ["F811"]

[format]
quote-style = "preserve"
